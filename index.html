<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Shape Drawer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-header {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: flex-end;
        }
        .nav-btn {
            background-color: #28a745;
            width: auto;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <div class="nav-header">
        <a href="3d.html"><button class="nav-btn">立体(3D)バージョンへ →</button></a>
    </div>
    <div class="container">
        <h1>図形描画アプリ</h1>

        <div class="controls">
            <div class="control-group">
                <label for="shapeType">図形の種類:</label>
                <select id="shapeType">
                    <option value="">選択してください</option>
                    <option value="triangle">三角形</option>
                    <option value="quadrilateral">四角形</option>
                    <option value="polygon">正多角形</option>
                    <option value="circle">円・楕円</option>
                </select>
            </div>

            <div class="control-group" id="methodGroup" style="display: none;">
                <label for="constructionMethod">入力タイプ:</label>
                <select id="constructionMethod">
                    <!-- Options will be populated dynamically -->
                </select>
            </div>

            <div id="inputsContainer">
                <!-- Inputs will be populated dynamically -->
            </div>

            <details id="advancedFeatures" style="margin-bottom: 20px; width: 100%;">
                <summary>高度な機能</summary>
                <div class="advanced-controls" style="padding: 10px; background: #eee; margin-top: 10px; border-radius: 4px;">
                    <label>
                        <input type="checkbox" id="freeDrawMode"> 自由描画モード (辺と角を順に追加)
                    </label>
                    <div id="freeDrawControls" style="display: none; margin-top: 10px;">
                        <div id="stepsContainer"></div>
                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <button id="addStepBtn" style="width: auto; background-color: #28a745;">+ ステップ追加</button>
                            <button id="removeStepBtn" style="width: auto; background-color: #dc3545;">- 削除</button>
                        </div>
                    </div>
                </div>
            </details>

            <button id="drawBtn" disabled>描画</button>
            <div id="errorMessage" class="error"></div>
        </div>

        <div class="canvas-container">
            <canvas id="geometryCanvas" width="600" height="600"></canvas>
        </div>
    </div>
    <script src="geometry.js"></script>
    <script src="script.js"></script>
</body>
</html>
